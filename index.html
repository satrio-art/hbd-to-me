<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Satrio Aditya's Birthday</title>

<style>
@import url("https://fonts.googleapis.com/css?family=Sacramento");

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    position: relative;
    background:
        radial-gradient(
            circle at 50% 38%,
            #3b315f 0%,
            #292247 32%,
            #1e1934 65%,
            #120f21 100%
        );
}

/* =========================
   FIREWORK CANVAS
========================= */

#fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 30;
    pointer-events: none;
}

/* =========================
   STARS
========================= */

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: .5;
    animation: twinkle 2.5s ease-in-out infinite;
    pointer-events: none;
}

@keyframes twinkle {
    0% {
        opacity: .15;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.3);
    }

    100% {
        opacity: .15;
        transform: scale(.7);
    }
}

/* =========================
   BIRTHDAY TEXT
========================= */

#message {
    position: fixed;
    left: 50%;
    bottom: clamp(25px, 6vh, 60px);

    width: 94%;

    transform: translateX(-50%);

    margin: 0;

    text-align: center;

    font-family: "Sacramento", cursive;
    font-size: clamp(2.2rem, 6vw, 4.2rem);
    font-weight: 400;

    letter-spacing: .06em;

    color: white;

    text-shadow:
        0 0 8px rgba(255,255,255,.6),
        0 0 20px rgba(255,90,140,.55),
        0 0 40px rgba(255,90,140,.25);

    z-index: 20;
}

.date {
    display: block;

    margin-top: 7px;

    font-family: Arial, sans-serif;

    font-size: clamp(.65rem, 2.5vw, 1rem);

    font-weight: 400;

    letter-spacing: .28em;

    color: #ffe0e9;

    text-shadow:
        0 0 8px #ff4b6f,
        0 0 18px rgba(255,75,111,.5);
}

/* =========================
   CANDLE AREA
========================= */

#candle {
    position: absolute;

    left: 50%;
    bottom: 31vh;

    width: 105px;
    height: 230px;

    transform: translateX(-50%);

    z-index: 10;
}

/* =========================
   CANDLE BODY
========================= */

.candle-body {
    position: absolute;

    left: 50%;
    bottom: 0;

    width: 70px;
    height: 170px;

    transform: translateX(-50%);

    border-radius: 7px 7px 10px 10px;

    background:
        linear-gradient(
            90deg,
            #bdbdbd 0%,
            #eeeeee 18%,
            #ffffff 42%,
            #eeeeee 65%,
            #b8b8b8 100%
        );

    border: 1px solid rgba(255,255,255,.35);

    box-shadow:
        inset 8px 0 10px rgba(255,255,255,.35),
        inset -8px 0 12px rgba(0,0,0,.15),
        0 8px 20px rgba(0,0,0,.3);
}

/* Candle top */

.candle-top {
    position: absolute;

    left: 50%;
    top: -6px;

    width: 70px;
    height: 17px;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center,
            #ffffff 0%,
            #eeeeee 65%,
            #c7c7c7 100%
        );

    z-index: 3;
}

/* =========================
   RED STRIPES
========================= */

.stripe {
    position: absolute;

    left: 50%;

    width: 82px;
    height: 12px;

    transform: translateX(-50%) rotate(-17deg);

    border-radius: 50px;

    background: #ff4b6f;

    box-shadow:
        0 1px 2px rgba(0,0,0,.25);

    z-index: 5;
}

.stripe:nth-child(1) {
    top: 25px;
}

.stripe:nth-child(2) {
    top: 55px;
    opacity: .92;
}

.stripe:nth-child(3) {
    top: 85px;
    opacity: .82;
}

.stripe:nth-child(4) {
    top: 115px;
    opacity: .72;
}

.stripe:nth-child(5) {
    top: 145px;
    opacity: .62;
}

/* =========================
   WICK
========================= */

#wick {
    position: absolute;

    left: 50%;
    top: -21px;

    width: 4px;
    height: 18px;

    transform: translateX(-50%);

    background:
        linear-gradient(
            90deg,
            #111,
            #3b251c,
            #111
        );

    border-radius: 3px;

    z-index: 20;
}

/* =========================
   REALISTIC FLAME
========================= */

#flame {
    position: absolute;

    left: 50%;
    top: -61px;

    width: 27px;
    height: 52px;

    transform: translateX(-50%);

    cursor: pointer;

    z-index: 25;

    border-radius:
        50% 50%
        50% 50% /
        65% 65%
        35% 35%;

    background:
        radial-gradient(
            ellipse at 50% 70%,
            #fffbd0 0%,
            #fff3a1 25%,
            #ffc928 52%,
            #ff7b00 76%,
            rgba(255,60,0,.1) 100%
        );

    box-shadow:
        0 0 8px #fff3a1,
        0 0 18px #ffc928,
        0 0 35px rgba(255,145,0,.8),
        0 0 55px rgba(255,90,0,.35);

    animation: flameMove 1.1s ease-in-out infinite;
}

/* Inner flame */

#flame::before {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 6px;

    width: 12px;
    height: 28px;

    transform: translateX(-50%);

    border-radius: 50% 50% 45% 45%;

    background:
        radial-gradient(
            ellipse at center bottom,
            #ffffff 0%,
            #fffbd0 50%,
            #ffd83d 100%
        );

    filter: blur(.2px);
}

/* Orange outer glow */

#flame::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 55px;
    height: 65px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(255,145,0,.13);

    filter: blur(10px);

    z-index: -1;
}

@keyframes flameMove {

    0% {
        transform:
            translateX(-50%)
            rotate(-3deg)
            scaleX(.95)
            scaleY(1);
    }

    25% {
        transform:
            translateX(-50%)
            rotate(3deg)
            scaleX(1.05)
            scaleY(.95);
    }

    50% {
        transform:
            translateX(-50%)
            rotate(-2deg)
            scaleX(.92)
            scaleY(1.08);
    }

    75% {
        transform:
            translateX(-50%)
            rotate(4deg)
            scaleX(1.03)
            scaleY(.97);
    }

    100% {
        transform:
            translateX(-50%)
            rotate(-3deg)
            scaleX(.95)
            scaleY(1);
    }
}

/* =========================
   FLAME HOVER
========================= */

#flame:hover {
    filter: brightness(1.15);
}

/* =========================
   FLAME OFF
========================= */

.flame-off {
    animation: flameOff .45s ease-out forwards !important;
}

@keyframes flameOff {

    0% {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(1);
    }

    50% {
        opacity: .7;
        transform:
            translateX(-50%)
            scale(.7)
            translateY(-7px);
    }

    100% {
        opacity: 0;
        transform:
            translateX(-50%)
            scale(.1)
            translateY(-20px);
    }
}

/* =========================
   LIGHT AROUND CANDLE
========================= */

#candle-glow {
    position: absolute;

    left: 50%;
    top: -45px;

    width: 90px;
    height: 90px;

    transform: translateX(-50%);

    border-radius: 50%;

    background: rgba(255,180,60,.12);

    filter: blur(20px);

    z-index: 1;

    animation: candleGlow 1.1s ease-in-out infinite;
}

@keyframes candleGlow {

    0% {
        opacity: .55;
        transform:
            translateX(-50%)
            scale(.85);
    }

    50% {
        opacity: .9;
        transform:
            translateX(-50%)
            scale(1.08);
    }

    100% {
        opacity: .55;
        transform:
            translateX(-50%)
            scale(.85);
    }
}

/* =========================
   SMOKE
========================= */

.smoke {
    position: absolute;

    left: 50%;
    top: -65px;

    width: 12px;
    height: 12px;

    margin-left: -6px;

    border-radius: 50%;

    background: rgba(225,225,225,.55);

    filter: blur(2px);

    opacity: 0;

    z-index: 22;
}

.smoke:nth-child(2) {
    width: 9px;
    height: 9px;
    margin-left: -15px;
}

.smoke:nth-child(3) {
    width: 8px;
    height: 8px;
    margin-left: 8px;
}

.smoke-show {
    animation: smokeRise 1.8s ease-out forwards;
}

@keyframes smokeRise {

    0% {
        opacity: .55;
        transform:
            translate(0,0)
            scale(.5);
    }

    35% {
        opacity: .4;
    }

    100% {
        opacity: 0;
        transform:
            translate(
                calc(-10px + 20px * var(--random)),
                -100px
            )
            scale(2.5);
    }
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

    #candle {
        bottom: 29vh;
        transform:
            translateX(-50%)
            scale(.78);
        transform-origin: bottom center;
    }

    #message {
        bottom: 5vh;
        font-size: clamp(2.2rem, 10vw, 3rem);
    }

    .date {
        margin-top: 5px;
        font-size: 9px;
        letter-spacing: .18em;
    }
}

@media (max-width: 380px) {

    #candle {
        bottom: 29vh;
        transform:
            translateX(-50%)
            scale(.68);
    }

    #message {
        bottom: 4vh;
        font-size: 2rem;
    }
}

@media (max-height: 500px) {

    #candle {
        bottom: 20vh;
        transform:
            translateX(-50%)
            scale(.62);
    }

    #message {
        bottom: 3vh;
        font-size: 1.8rem;
    }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<h1 id="message">
    Pencet api, bro 🔥
</h1>

<div id="candle">

    <div id="candle-glow"></div>

    <!-- Smoke -->
    <div class="smoke"></div>
    <div class="smoke"></div>
    <div class="smoke"></div>

    <!-- Candle -->
    <div class="candle-body">

        <div class="candle-top"></div>

        <div class="stripe"></div>
        <div class="stripe"></div>
        <div class="stripe"></div>
        <div class="stripe"></div>
        <div class="stripe"></div>

    </div>

    <!-- Wick -->
    <div id="wick"></div>

    <!-- Flame -->
    <div id="flame"></div>

</div>


<script>

/* =====================================================
   FIREWORK SYSTEM
===================================================== */

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

let rockets = [];
let particles = [];

const colors = [
    "#ff4b6f",
    "#ffd166",
    "#06d6a0",
    "#4cc9f0",
    "#c77dff",
    "#ffffff",
    "#ff9f1c",
    "#ff7b9c"
];

/* Resize */

function resizeCanvas() {

    const ratio = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * ratio;
    canvas.height = H * ratio;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   CANDLE POSITION
===================================================== */

function getCandlePosition() {

    const candle =
        document
            .getElementById("candle")
            .getBoundingClientRect();

    return {
        x: candle.left + candle.width / 2,
        y: candle.top
    };
}


/* =====================================================
   LAUNCH ROCKET
===================================================== */

function launchFirework(
    targetX,
    targetY,
    delay = 0
) {

    setTimeout(() => {

        const candle =
            getCandlePosition();

        /* Keep target inside screen */

        targetX = Math.max(
            50,
            Math.min(W - 50, targetX)
        );

        targetY = Math.max(
            70,
            Math.min(H * .58, targetY)
        );

        rockets.push({

            x: candle.x,

            y: H + 25,

            targetX: targetX,

            targetY: targetY,

            speed: 7 + Math.random() * 2,

            color:
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ],

            trail: []

        });

    }, delay);
}


/* =====================================================
   EXPLOSION
===================================================== */

function explode(
    x,
    y,
    color
) {

    const amount =
        W < 500
            ? 70
            : 105;

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            2.2 +
            Math.random() * 5.5;

        particles.push({

            x: x,
            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            gravity: .055,

            friction: .985,

            alpha: 1,

            decay:
                .008 +
                Math.random() * .012,

            size:
                .8 +
                Math.random() * 2,

            color:
                Math.random() < .72
                    ? color
                    : colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ]

        });
    }

    /* Bright flash */

    particles.push({

        x: x,
        y: y,

        vx: 0,
        vy: 0,

        gravity: 0,
        friction: 1,

        alpha: .9,

        decay: .08,

        size: 9,

        color: "#ffffff"

    });
}


/* =====================================================
   FIREWORK ANIMATION
===================================================== */

function animateFireworks() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    /* -------------------------
       ROCKETS
    ------------------------- */

    for (
        let i = rockets.length - 1;
        i >= 0;
        i--
    ) {

        const r = rockets[i];

        const dx =
            r.targetX - r.x;

        const dy =
            r.targetY - r.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        const vx =
            dx / distance *
            r.speed;

        const vy =
            dy / distance *
            r.speed;

        /* Trail */

        r.trail.push({
            x: r.x,
            y: r.y
        });

        if (r.trail.length > 12) {
            r.trail.shift();
        }

        for (
            let t = 0;
            t < r.trail.length;
            t++
        ) {

            const point =
                r.trail[t];

            ctx.beginPath();

            ctx.arc(
                point.x,
                point.y,
                Math.max(
                    .7,
                    2 - t * .12
                ),
                0,
                Math.PI * 2
            );

            ctx.fillStyle = r.color;

            ctx.globalAlpha =
                (1 - t / r.trail.length) *
                .55;

            ctx.fill();
        }

        ctx.globalAlpha = 1;

        /* Rocket head */

        ctx.beginPath();

        ctx.arc(
            r.x,
            r.y,
            2.8,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#ffffff";

        ctx.shadowBlur = 16;
        ctx.shadowColor = r.color;

        ctx.fill();

        ctx.shadowBlur = 0;

        /* Move */

        r.x += vx;
        r.y += vy;

        /* Explosion */

        if (distance < 13) {

            explode(
                r.x,
                r.y,
                r.color
            );

            rockets.splice(i, 1);
        }
    }


    /* -------------------------
       PARTICLES
    ------------------------- */

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p = particles[i];

        p.vx *= p.friction;
        p.vy *= p.friction;

        p.vy += p.gravity;

        p.x += p.vx;
        p.y += p.vy;

        p.alpha -= p.decay;

        if (p.alpha <= 0) {

            particles.splice(i, 1);

            continue;
        }

        ctx.save();

        ctx.globalAlpha =
            p.alpha;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            p.color;

        ctx.shadowBlur = 9;

        ctx.shadowColor =
            p.color;

        ctx.fill();

        ctx.restore();
    }

    requestAnimationFrame(
        animateFireworks
    );
}

animateFireworks();


/* =====================================================
   CLICK FLAME
===================================================== */

let clicked = false;

document
    .getElementById("flame")
    .addEventListener(
        "click",
        function () {

            if (clicked) return;

            clicked = true;

            /* Turn off flame */

            this.classList.add(
                "flame-off"
            );

            /* Hide candle glow */

            document
                .getElementById("candle-glow")
                .style.animation =
                "none";

            document
                .getElementById("candle-glow")
                .style.opacity = "0";


            /* Smoke */

            document
                .querySelectorAll(".smoke")
                .forEach(
                    (smoke, index) => {

                        smoke.style.setProperty(
                            "--random",
                            Math.random()
                        );

                        setTimeout(
                            () => {

                                smoke.classList.add(
                                    "smoke-show"
                                );

                            },
                            index * 160
                        );
                    }
                );


            /* Birthday message */

            const message =
                document.getElementById(
                    "message"
                );

            message.style.opacity = "0";

            setTimeout(() => {

                message.innerHTML =
                    `
                    Happy birthday to me 🦇
                    <span class="date">
                        15 OKTOBER 2026
                    </span>
                    `;

                message.style.transition =
                    "opacity .8s ease";

                message.style.opacity = "1";

            }, 300);


            /* Slightly fade candle */

            document
                .getElementById("candle")
                .style.transition =
                "opacity .8s ease";

            document
                .getElementById("candle")
                .style.opacity =
                ".75";


            /* =========================
               FIREWORK SEQUENCE
            ========================= */

            setTimeout(() => {

                const c =
                    getCandlePosition();

                /* First */

                launchFirework(
                    c.x - 110,
                    c.y - 170,
                    0
                );

                /* Second */

                launchFirework(
                    c.x + 115,
                    c.y - 200,
                    500
                );

                /* Center */

                launchFirework(
                    c.x,
                    c.y - 260,
                    950
                );

                /* Left */

                launchFirework(
                    c.x - 155,
                    c.y - 245,
                    1400
                );

                /* Right */

                launchFirework(
                    c.x + 155,
                    c.y - 275,
                    1850
                );

                /* Top center */

                launchFirework(
                    c.x - 30,
                    c.y - 330,
                    2300
                );

            }, 500);

        }
    );


/* =====================================================
   STARS
===================================================== */

for (
    let i = 0;
    i < 55;
    i++
) {

    const star =
        document.createElement(
            "div"
        );

    star.className =
        "star";

    star.style.left =
        Math.random() * 100 +
        "%";

    star.style.top =
        Math.random() * 75 +
        "%";

    star.style.animationDelay =
        Math.random() * 3 +
        "s";

    document.body.appendChild(
        star
    );
}

</script>

</body>
</html>
